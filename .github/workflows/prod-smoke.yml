name: Production smoke (Playwright)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC

jobs:
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production smoke tests (serial)
        env:
          TEST_EMAIL: ${{ secrets.PROD_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.PROD_TEST_PASSWORD }}
        run: pnpm exec playwright test --config=playwright.config.ts --workers=1 --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
